<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZANIVA DIGITAL | O digital ganha uma nova dimensão</title>
    <meta
      name="description"
      content="A Zaniva Digital desenvolve sites e landing pages, sistemas e aplicações web, automações com inteligência artificial, chatbots e gestão do Perfil da Empresa no Google."
    />
    <meta name="theme-color" content="#080914" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- O poster do hero é o LCP: carrega antes de qualquer outra imagem. -->
    <link rel="preload" as="image" href="/media/hero-poster.webp" type="image/webp" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="ZANIVA DIGITAL" />
    <meta property="og:title" content="ZANIVA DIGITAL | O digital ganha uma nova dimensão" />
    <meta
      property="og:description"
      content="Unimos estratégia, tecnologia e criatividade para transformar a presença digital de negócios."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Paisagem de capim rosa e violeta sob céu claro, com a marca Zaniva Digital." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZANIVA DIGITAL | O digital ganha uma nova dimensão" />
    <meta
      name="twitter:description"
      content="Unimos estratégia, tecnologia e criatividade para transformar a presença digital de negócios."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ZANIVA DIGITAL",
        "url": "__SITE_URL__/",
        "slogan": "O digital ganha uma nova dimensão.",
        "description": "Agência digital: sites e landing pages, sistemas e aplicações web, automações com inteligência artificial, chatbots e gestão do Perfil da Empresa no Google.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+55-11-94810-8450",
          "contactType": "sales",
          "availableLanguage": ["Portuguese"]
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <p class="noscript-message">
        Ative o JavaScript para navegar pelo site da ZANIVA DIGITAL. Fale conosco pelo WhatsApp:
        <a href="https://wa.me/5511948108450" rel="noopener noreferrer">+55 11 94810-8450</a>.
      </p>
      <!-- Onde o script nunca roda, a cortina nunca poderia subir. -->
      <style>
        [data-preloader] {
          display: none !important;
        }
      </style>
    </noscript>

    <!--
      Cortina de carregamento. Fica no HTML inicial de propósito: montada pelo
      React, haveria um piscar da página antes dela. Os estilos são inline pelo
      mesmo motivo — a folha de estilo ainda não chegou.
    -->
    <div data-preloader class="preloader" role="status" aria-live="polite">
      <span class="preloader-bracket" data-corner="tl" aria-hidden="true"></span>
      <span class="preloader-bracket" data-corner="tr" aria-hidden="true"></span>
      <span class="preloader-bracket" data-corner="bl" aria-hidden="true"></span>
      <span class="preloader-bracket" data-corner="br" aria-hidden="true"></span>

      <div class="preloader-column">
        <span class="preloader-mark" aria-hidden="true">zaniva.</span>
        <div class="preloader-rule" aria-hidden="true">
          <span class="preloader-fill" data-preloader-fill></span>
        </div>
        <p class="preloader-readout">
          <span aria-hidden="true">CARREGANDO <span data-preloader-count>000</span></span>
          <span class="sr-only">Carregando o site da Zaniva Digital</span>
        </p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
